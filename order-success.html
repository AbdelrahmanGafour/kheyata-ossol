<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم استلام طلبك | للخياطة أصول</title>
<link rel="icon" href="assets/images/logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .success-wrap { max-width: 560px; margin: 0 auto; text-align: center; padding: 40px 0 80px; }
  .success-icon { width: 96px; height: 96px; border-radius: 50%; background: var(--color-bg-alt); border: 2px solid var(--color-accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 42px; color: var(--color-primary); }
  .order-id-box { background: var(--color-white); border-radius: var(--radius-md); box-shadow: var(--shadow-soft); padding: 20px; margin: 24px 0; font-family: var(--font-heading); font-size: 20px; color: var(--color-primary); }
</style>
</head>
<body>

<script src="assets/js/partials/header.js"></script>

<main>
  <div class="container success-wrap">
    <div class="success-icon"><i class="fa-solid fa-check"></i></div>
    <h1>تم استلام طلبك بنجاح!</h1>
    <p class="mt-2">شكرًا لثقتك في "للخياطة أصول". سيتواصل معك فريقنا لتأكيد الطلب، وسيصلك خلال 2-4 أيام عمل. الدفع عند الاستلام.</p>
    <div class="order-id-box">رقم الطلب: <span id="order-id">—</span></div>
    <div class="flex flex-center gap-2" style="flex-wrap:wrap;">
      <a href="store.html" class="btn btn-primary">متابعة التسوق</a>
      <a href="index.html" class="btn btn-outline">العودة للرئيسية</a>
    </div>
  </div>
</main>

<script src="assets/js/partials/footer-minimal.js"></script>

<script src="assets/vendor/gsap/gsap.min.js"></script>
<script src="assets/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="assets/vendor/animejs/anime.min.js"></script>
<script src="assets/js/products-data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script>
  document.getElementById('order-id').textContent = localStorage.getItem('ko_last_order') || '—';
  if (typeof anime !== 'undefined') {
    anime.animate('.success-icon', { scale: [0, 1], rotate: [-30, 0], duration: 700, ease: 'outElastic(1, .6)' });
  }
</script>
</body>
</html>
