<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي | للخياطة أصول</title>
<link rel="icon" href="assets/images/logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .account-layout { display: grid; grid-template-columns: 1fr; gap: 32px; }
  @media (min-width: 900px) { .account-layout { grid-template-columns: 280px 1fr; } }
  .account-side { background: var(--color-white); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); padding: 28px; text-align: center; height: fit-content; }
  .account-avatar { width: 84px; height: 84px; border-radius: 50%; background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 16px; font-family: var(--font-heading); }
  .order-card { background: var(--color-white); border-radius: var(--radius-md); box-shadow: var(--shadow-soft); padding: 20px; margin-bottom: 16px; }
  .order-card .order-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .order-status { background: var(--color-bg-alt); color: var(--color-accent-dark); padding: 5px 14px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 700; }
</style>
</head>
<body>

<script src="assets/js/partials/header.js"></script>

<main>
  <div class="page-header">
    <div class="container">
      <h1>حسابي</h1>
      <div class="breadcrumb"><a href="index.html">الرئيسية</a><span>/</span><span>حسابي</span></div>
    </div>
  </div>

  <section>
    <div class="container">

      <div id="account-guest" class="empty-state" style="display:none;">
        <i class="fa-solid fa-user-lock"></i>
        <h3>سجّل الدخول لعرض حسابك</h3>
        <p class="mb-3">تحتاج لتسجيل الدخول أولاً لمشاهدة بياناتك وطلباتك السابقة.</p>
        <a href="login.html" class="btn btn-primary">تسجيل الدخول</a>
      </div>

      <div id="account-content" class="account-layout" style="display:none;">
        <aside class="account-side">
          <div class="account-avatar"><i class="fa-solid fa-user"></i></div>
          <h3 id="account-name">—</h3>
          <p class="mb-3" id="account-phone" style="direction:ltr;">—</p>
          <button class="btn btn-outline btn-block btn-sm" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
        </aside>
        <div>
          <h3 class="mb-3"><i class="fa-solid fa-box-open"></i> طلباتي</h3>
          <div id="orders-list"></div>
          <div class="empty-state" id="orders-empty" style="display:none;">
            <i class="fa-solid fa-inbox"></i>
            <h3>لا توجد طلبات بعد</h3>
            <p class="mb-3">ابدأ التسوّق الآن واطلب أدواتك المفضلة.</p>
            <a href="store.html" class="btn btn-primary">تصفّح المتجر</a>
          </div>
        </div>
      </div>

    </div>
  </section>
</main>

<script src="assets/js/partials/footer-minimal.js"></script>

<script src="assets/vendor/gsap/gsap.min.js"></script>
<script src="assets/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="assets/vendor/animejs/anime.min.js"></script>
<script src="assets/js/products-data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
<script>
  (function () {
    var user = getCurrentUser();
    if (!user) {
      document.getElementById('account-guest').style.display = 'block';
      return;
    }
    document.getElementById('account-content').style.display = 'grid';
    document.getElementById('account-name').textContent = user.name;
    document.getElementById('account-phone').textContent = '0' + user.phone;
    document.getElementById('logout-btn').addEventListener('click', logoutUser);

    var orders = JSON.parse(localStorage.getItem('ko_orders') || '[]').filter(function (o) { return o.phone === user.phone; });
    if (!orders.length) {
      document.getElementById('orders-empty').style.display = 'block';
      return;
    }
    var html = orders.map(function (o) {
      var itemsHtml = o.items.map(function (i) { return '<div class="mini-item"><span>' + i.name + ' × ' + i.qty + '</span><span>' + formatPrice(i.price * i.qty) + '</span></div>'; }).join('');
      return (
        '<div class="order-card">' +
          '<div class="order-head"><strong>طلب رقم ' + o.id + '</strong><span class="order-status"><i class="fa-solid fa-clock"></i> قيد المراجعة</span></div>' +
          '<div class="form-hint mb-2">' + new Date(o.date).toLocaleDateString('ar-EG-u-nu-latn', { year: 'numeric', month: 'long', day: 'numeric' }) + '</div>' +
          itemsHtml +
          '<div class="flex-between mt-2"><strong>الإجمالي</strong><strong class="price">' + formatPrice(o.total) + '</strong></div>' +
        '</div>'
      );
    }).join('');
    document.getElementById('orders-list').innerHTML = html;
  })();
</script>
</body>
</html>
