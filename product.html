<!DOCTYPE html>

<link rel="stylesheet" href="assets/css/style.css">
<style>
  .product-detail { display: grid; grid-template-columns: 1fr; gap: 40px; }
  @media (min-width: 900px) { .product-detail { grid-template-columns: 1fr 1fr; } }
  .product-gallery img { width: 100%; border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); aspect-ratio: 4/5; object-fit: cover; }
  .qty-selector { display: flex; align-items: center; gap: 0; border: 1.5px solid var(--color-border); border-radius: var(--radius-sm); width: fit-content; }
  .qty-selector button { width: 44px; height: 44px; font-size: 18px; color: var(--color-primary); }
  .qty-selector input { width: 52px; text-align: center; border: none; font-weight: 700; font-size: 16px; }
  .stock-badge { display: inline-flex; align-items: center; gap: 6px; color: var(--color-primary); font-size: 14px; font-weight: 700; }
  .feature-mini { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--color-text-muted); }
  .feature-mini i { color: var(--color-accent-dark); }
</style>
</head>

    </div>
  </div>

  <section>
    <div class="container">
      <div class="product-detail" id="product-detail-root">
        <!-- يُملأ بواسطة JavaScript -->
      </div>
    </div>
  </section>

  <section class="section-alt">
    <div class="container">
      <div class="section-head" data-reveal>
        <span class="section-eyebrow">قد يعجبك أيضًا</span>
        <h2>منتجات ذات صلة</h2>
      </div>
      <div class="grid grid-4" id="related-products"></div>
    </div>
  </section>

</main>

<script src="assets/js/partials/footer-full.js"></script>
