<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلة المشتريات | للخياطة أصول</title>
<meta name="description" content="راجع منتجاتك في سلة المشتريات قبل إتمام الطلب في متجر للخياطة أصول.">
<link rel="icon" href="assets/images/logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .cart-layout { display: grid; grid-template-columns: 1fr; gap: 32px; align-items: start; }
  @media (min-width: 900px) { .cart-layout { grid-template-columns: 1fr 360px; } }
  .cart-item { display: grid; grid-template-columns: 84px 1fr auto; gap: 16px; align-items: center; padding: 18px; background: var(--color-white); border-radius: var(--radius-md); box-shadow: var(--shadow-soft); margin-bottom: 14px; }
  .cart-item img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; }
  .cart-item h3 { font-size: 16px; margin-bottom: 6px; }
  .cart-item .cat { font-size: 12px; color: var(--color-accent-dark); font-weight: 700; }
  .cart-qty { display: flex; align-items: center; border: 1.5px solid var(--color-border); border-radius: var(--radius-sm); width: fit-content; }
  .cart-qty button { width: 34px; height: 34px; color: var(--color-primary); }
  .cart-qty input { width: 40px; text-align: center; border: none; font-weight: 700; }
  .cart-item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .remove-btn { color: var(--color-danger); font-size: 14px; }
  .summary-card { background: var(--color-white); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); padding: 28px; position: sticky; top: calc(var(--header-height) + 24px); }
  @media (max-width: 560px) { .cart-item { grid-template-columns: 64px 1fr; } .cart-item-actions { grid-column: span 2; flex-direction: row; justify-content: space-between; align-items: center; } .cart-item img { width: 64px; height: 64px; } }
</style>
</head>
<body>

<script src="assets/js/partials/header.js"></script>

<main>
  <div class="page-header">
    <div class="container">
      <h1>سلة المشتريات</h1>
      <div class="breadcrumb"><a href="index.html">الرئيسية</a><span>/</span><span>السلة</span></div>
    </div>
  </div>

  <section>
    <div class="container">
      <div class="cart-layout" id="cart-layout">
        <div>
          <div id="cart-items"></div>
        </div>
        <aside class="summary-card">
          <h3 class="mb-3">ملخص الطلب</h3>
          <div class="summary-row"><span>عدد القطع</span><span id="summary-count">0</span></div>
          <div class="summary-row"><span>المجموع الفرعي</span><span id="summary-subtotal">0 ج.م</span></div>
          <div class="summary-row"><span>الشحن</span><span id="summary-shipping">0 ج.م</span></div>
          <div class="summary-row total"><span>الإجمالي</span><span id="summary-total">0 ج.م</span></div>
          <p class="form-hint mb-3">التوصيل مجاني للطلبات فوق 1500 ج.م</p>
          <a href="checkout.html" class="btn btn-primary btn-block" id="checkout-btn"><i class="fa-solid fa-lock"></i> إتمام الطلب</a>
          <a href="store.html" class="link-arrow mt-3" style="justify-content:center; display:flex;">متابعة التسوق <i class="fa-solid fa-arrow-left"></i></a>
        </aside>
      </div>

      <div class="empty-state" id="cart-empty" style="display:none;">
        <i class="fa-solid fa-cart-shopping"></i>
        <h3>سلتك فارغة حاليًا</h3>
        <p class="mb-3">لم تقم بإضافة أي منتجات بعد. تصفّح المتجر واختر ما يناسبك.</p>
        <a href="store.html" class="btn btn-primary">تصفّح المتجر</a>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/partials/footer-full.js"></script>

<script src="assets/vendor/gsap/gsap.min.js"></script>
<script src="assets/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="assets/vendor/animejs/anime.min.js"></script>
<script src="assets/js/products-data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/anime-scroll.js"></script>
<script src="assets/js/cart-page.js"></script>
</body>
</html>
