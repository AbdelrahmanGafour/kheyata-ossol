<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر | للخياطة أصول</title>
<meta name="description" content="تصفّح متجر للخياطة أصول: ماكينات خياطة، أدوات قص وقياس، خيوط وإبر، أقمشة وإكسسوارات أصلية بجودة تصدير.">
<link rel="icon" href="assets/images/logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .store-layout { display: grid; grid-template-columns: 1fr; gap: 32px; align-items: start; }
  @media (min-width: 960px) { .store-layout { grid-template-columns: 260px 1fr; } }
  .filters-card { background: var(--color-white); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); padding: 24px; top: calc(var(--header-height) + 24px); }
  .filters-card h4 { font-family: var(--font-heading); margin-bottom: 16px; }
  .filter-group { margin-bottom: 24px; }
  .filter-group label { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; cursor: pointer; }
  .filter-group input[type="radio"], .filter-group input[type="checkbox"] { accent-color: var(--color-primary); width: 16px; height: 16px; }
  .store-toolbar { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .search-box { position: relative; flex: 1; min-width: 220px; }
  .search-box i { position: absolute; top: 50%; right: 16px; transform: translateY(-50%); color: var(--color-text-muted); }
  .search-box input { width: 100%; padding: 12px 44px 12px 16px; border-radius: var(--radius-pill); border: 1.5px solid var(--color-border); background: var(--color-white); }
  select.form-control { width: auto; }
  .price-range-value { font-size: 13px; color: var(--color-text-muted); margin-top: 6px; }
  .results-count { font-size: 14px; color: var(--color-text-muted); }
</style>
</head>
<body>

<script src="assets/js/partials/header.js"></script>

<main>

  <div class="page-header">
    <div class="container">
      <h1>المتجر</h1>
      <div class="breadcrumb"><a href="index.html">الرئيسية</a><span>/</span><span>المتجر</span></div>
    </div>
  </div>

  <section>
    <div class="container store-layout">

      <aside class="filters-card">
        <h4><i class="fa-solid fa-sliders"></i> الفلاتر</h4>
        <div class="filter-group">
          <strong style="font-size:14px;">التصنيف</strong>
          <label><input type="radio" name="category" value="" checked> كل التصنيفات</label>
          <div id="category-filters"></div>
        </div>
        <div class="filter-group">
          <strong style="font-size:14px;">السعر الأقصى</strong>
          <input type="range" id="price-range" min="50" max="9000" step="50" value="9000" style="width:100%; accent-color: var(--color-primary); margin-top:12px;">
          <div class="price-range-value">حتى <span id="price-range-value">9000</span> ج.م</div>
        </div>
        <button class="btn btn-outline btn-block btn-sm" id="reset-filters"><i class="fa-solid fa-rotate-left"></i> إعادة ضبط</button>
      </aside>

      <div>
        <div class="store-toolbar">
          <div class="search-box">
            <input type="text" id="search-input" placeholder="ابحث عن أداة أو ماكينة...">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <div class="flex gap-2" style="align-items:center;">
            <span class="results-count"><span id="results-count">0</span> منتج</span>
            <select id="sort-select" class="form-control">
              <option value="default">الترتيب الافتراضي</option>
              <option value="price-asc">السعر: من الأقل للأعلى</option>
              <option value="price-desc">السعر: من الأعلى للأقل</option>
              <option value="rating">الأعلى تقييمًا</option>
            </select>
          </div>
        </div>

        <div class="grid grid-3" id="store-grid"></div>
        <div class="empty-state" id="empty-state" style="display:none;">
          <i class="fa-solid fa-magnifying-glass-minus"></i>
          <h3>لا توجد منتجات مطابقة</h3>
          <p>جرّب تعديل الفلاتر أو كلمة البحث.</p>
        </div>
      </div>

    </div>
  </section>

</main>

<script src="assets/js/partials/footer-full.js"></script>

<script src="assets/vendor/gsap/gsap.min.js"></script>
<script src="assets/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="assets/vendor/animejs/anime.min.js"></script>
<script src="assets/js/products-data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/anime-scroll.js"></script>
<script src="assets/js/carousel.js"></script>
<script src="assets/js/store.js"></script>
</body>
</html>
