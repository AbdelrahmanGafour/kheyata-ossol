<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | للخياطة أصول</title>
<meta name="description" content="سجّل الدخول إلى حسابك في متجر للخياطة أصول برقم هاتفك.">
<link rel="icon" href="assets/images/logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .auth-page { min-height: 100vh; display: flex; align-items: center; padding: calc(var(--header-height) + 40px) 0 60px; background: linear-gradient(160deg, var(--color-bg-alt), var(--color-bg)); }
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand">
      <img src="assets/images/logo.webp" alt="شعار للخياطة أصول">
      <span class="brand-text"><strong>للخياطة أصول</strong><span>أدوات خياطة + تعليم احترافي</span></span>
    </a>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="store.html">المتجر</a></li>
        <li><a href="about.html">من نحن</a></li>
        <li><a href="contact.html">تواصل معنا</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <a href="login.html" class="icon-btn" data-auth-account-link title="تسجيل الدخول"><i class="fa-solid fa-user"></i></a>
      <a href="cart.html" class="icon-btn"><i class="fa-solid fa-cart-shopping"></i><span class="cart-badge">0</span></a>
      <button class="nav-toggle" aria-label="القائمة"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>
  <div class="mobile-nav">
    <ul>
      <li><a href="index.html">الرئيسية <i class="fa-solid fa-house"></i></a></li>
      <li><a href="store.html">المتجر <i class="fa-solid fa-store"></i></a></li>
      <li><a href="about.html">من نحن <i class="fa-solid fa-circle-info"></i></a></li>
      <li><a href="contact.html">تواصل معنا <i class="fa-solid fa-envelope"></i></a></li>
      <li><a href="login.html">حسابي <i class="fa-solid fa-user"></i></a></li>
    </ul>
  </div>
</header>

<main class="auth-page">
  <div class="container">
    <div class="auth-card" data-reveal>
      <img src="assets/images/logo.webp" alt="شعار للخياطة أصول" class="logo-mark">
      <h1>تسجيل الدخول</h1>
      <p class="lead-sm">سجّل الدخول برقم هاتفك للمتابعة إلى حسابك</p>

      <form id="login-form">
        <div class="form-field">
          <label for="login-phone">رقم الهاتف</label>
          <div class="phone-input-group">
            <span class="country-code"><i class="fa-solid fa-flag"></i> 20+</span>
            <input type="tel" id="login-phone" class="form-control" placeholder="01xxxxxxxxx" required>
          </div>
          <span class="form-error">رقم الهاتف غير صحيح</span>
        </div>
        <div class="form-field">
          <label for="login-password">كلمة المرور</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          <span class="form-error">كلمة المرور مطلوبة</span>
        </div>
        <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
      </form>

      <p class="auth-switch">ليس لديك حساب؟ <a href="register.html">أنشئ حسابًا جديدًا</a></p>
    </div>
  </div>
</main>

<script src="assets/vendor/gsap/gsap.min.js"></script>
<script src="assets/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="assets/vendor/animejs/anime.min.js"></script>
<script src="assets/js/products-data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/auth-pages.js"></script>
</body>
</html>
